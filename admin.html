<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://tfwejlwycexmcgznxlao.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_RnheFzHcB78UTEaXBYOp9g_ZbktcycR";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   HORARIOS
========================= */

const horarios = [
  "14:40",
  "15:40",
  "16:40",
  "17:40",
  "18:40",
  "19:40",
  "20:40"
];


let fechaActual =
  new Date();


const nombresMeses = [
  "enero",
  "febrero",
  "marzo",
  "abril",
  "mayo",
  "junio",
  "julio",
  "agosto",
  "septiembre",
  "octubre",
  "noviembre",
  "diciembre"
];


/* =========================
   LOGIN
========================= */

async function iniciarSesion() {

  const email =
    document.getElementById(
      "email"
    ).value.trim();

  const password =
    document.getElementById(
      "password"
    ).value;

  const mensaje =
    document.getElementById(
      "mensajeLogin"
    );

  mensaje.textContent = "";


  if (!email || !password) {

    mensaje.textContent =
      "Completá Gmail y contraseña.";

    return;
  }


  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });


  if (error) {

    console.error(error);

    mensaje.textContent =
      "Gmail o contraseña incorrectos.";

    return;
  }


  mostrarAdmin();

}


/* =========================
   MOSTRAR ADMIN
========================= */

function mostrarAdmin() {

  document.getElementById(
    "login"
  ).classList.add("oculto");

  document.getElementById(
    "admin"
  ).classList.remove("oculto");

  mostrarFechaHoy();

  actualizarTodo();

}


/* =========================
   CERRAR SESIÓN
========================= */

async function cerrarSesion() {

  await supabaseClient.auth.signOut();

  document.getElementById(
    "admin"
  ).classList.add("oculto");

  document.getElementById(
    "login"
  ).classList.remove("oculto");

  document.getElementById(
    "password"
  ).value = "";

}


/* =========================
   COMPROBAR SESIÓN
========================= */

async function comprobarSesion() {

  const {
    data
  } =
    await supabaseClient.auth.getSession();


  if (
    data.session
  ) {

    mostrarAdmin();

  } else {

    document.getElementById(
      "login"
    ).classList.remove("oculto");

  }

}


/* =========================
   FORMATO FECHA
========================= */

function formatoFecha(fecha) {

  const año =
    fecha.getFullYear();

  const mes =
    String(
      fecha.getMonth() + 1
    ).padStart(2, "0");

  const dia =
    String(
      fecha.getDate()
    ).padStart(2, "0");

  return `${año}-${mes}-${dia}`;
}


/* =========================
   FECHA HOY
========================= */

function mostrarFechaHoy() {

  const hoy =
    new Date();

  const texto =
    hoy.toLocaleDateString(
      "es-AR",
      {
        weekday: "long",
        day: "numeric",
        month: "long"
      }
    );

  document.getElementById(
    "fechaHoy"
  ).textContent = texto;

}


/* =========================
   CARGAR TURNOS HOY
========================= */

async function cargarTurnosHoy() {

  const contenedor =
    document.getElementById(
      "turnosHoy"
    );

  const hoy =
    formatoFecha(
      new Date()
    );


  contenedor.innerHTML =
    '<p class="sin-turnos">Cargando...</p>';


  try {

    const { data, error } =
      await supabaseClient
        .from("turnos")
        .select(
          "id,fecha,hora,nombre,telefono,estado"
        )
        .eq("fecha", hoy)
        .order("hora", {
          ascending: true
        });


    if (error) {
      throw error;
    }


    const activos =
      data.filter(
        function(turno) {

          return turno.estado !==
            "cancelado";

        }
      );


    contenedor.innerHTML = "";


    if (
      activos.length === 0
    ) {

      contenedor.innerHTML =
        '<p class="sin-turnos">' +
        'No hay turnos para hoy.' +
        '</p>';

      return;
    }


    activos.forEach(
      function(turno) {

        const div =
          document.createElement(
            "div"
          );

        div.className =
          "turno-hoy";


        if (
          turno.estado ===
          "bloqueado"
        ) {

          div.innerHTML = `

            <strong>
              🕐 ${turno.hora}
            </strong>

            <p>
              🚫 Horario bloqueado
            </p>

          `;

        } else {

          div.innerHTML = `

            <strong>
              🕐 ${turno.hora}
            </strong>

            <p>
              👤 ${turno.nombre}
            </p>

            <p>
              📱 ${turno.telefono}
            </p>

            <p>
              Estado: ${turno.estado}
            </p>

          `;

        }


        contenedor.appendChild(
          div
        );

      }
    );


  } catch (error) {

    console.error(error);

    contenedor.innerHTML =
      '<p class="error">' +
      'No se pudieron cargar los turnos.' +
      '</p>';

  }

}


/* =========================
   CARGAR TURNOS DEL MES
========================= */

async function cargarTurnos() {

  const contenedor =
    document.getElementById(
      "turnos"
    );

  const nombreMes =
    document.getElementById(
      "nombreMes"
    );


  nombreMes.textContent =
    nombresMeses[
      fechaActual.getMonth()
    ] +
    " " +
    fechaActual.getFullYear();


  contenedor.innerHTML =
    '<p class="vacio">Cargando...</p>';


  const año =
    fechaActual.getFullYear();

  const mes =
    fechaActual.getMonth();


  const primerDia =
    formatoFecha(
      new Date(
        año,
        mes,
        1
      )
    );


  const ultimoDia =
    formatoFecha(
      new Date(
        año,
        mes + 1,
        0
      )
    );


  try {

    const { data, error } =
      await supabaseClient
        .from("turnos")
        .select(
          "id,fecha,hora,nombre,telefono,estado"
        )
        .gte("fecha", primerDia)
        .lte("fecha", ultimoDia)
        .order("fecha", {
          ascending: true
        })
        .order("hora", {
          ascending: true
        });


    if (error) {
      throw error;
    }


    contenedor.innerHTML = "";


    if (
      data.length === 0
    ) {

      contenedor.innerHTML =
        '<p class="vacio">' +
        'No hay turnos este mes.' +
        '</p>';

      return;
    }


    data.forEach(
      function(turno) {

        const div =
          document.createElement(
            "div"
          );

        div.className =
          "turno";


        let boton = "";


        if (
          turno.estado ===
          "bloqueado"
        ) {

          boton = `

            <button
              class="desbloquear"
              onclick="desbloquearHorario(${turno.id})"
            >
              🔓 Desbloquear horario
            </button>

          `;

        } else if (
          turno.estado !==
          "cancelado"
        ) {

          boton = `

            <button
              class="cancelar"
              onclick="cancelarTurno(${turno.id})"
            >
              ❌ Cancelar turno
            </button>

          `;

        }


        div.innerHTML = `

          <strong>
            📅 ${turno.fecha}
            — 🕐 ${turno.hora}
          </strong>

          ${
            turno.estado === "bloqueado"

            ? `
              <p>
                🚫 Horario bloqueado
              </p>
            `

            : `
              <p>
                👤 ${turno.nombre}
              </p>

              <p>
                📱 ${turno.telefono}
              </p>
            `
          }

          <p>
            Estado: ${turno.estado}
          </p>

          ${boton}

        `;


        contenedor.appendChild(
          div
        );

      }
    );


  } catch (error) {

    console.error(error);

    contenedor.innerHTML =
      '<p class="error">' +
      'No se pudieron cargar los turnos.' +
      '</p>';

  }

}


/* =========================
   ACTUALIZAR
========================= */

function actualizarTodo() {

  cargarTurnosHoy();

  cargarTurnos();

}


/* =========================
   BLOQUEAR HORARIO
========================= */

async function bloquearHorario() {

  const fecha =
    document.getElementById(
      "fechaBloqueo"
    ).value;

  const hora =
    document.getElementById(
      "horaBloqueo"
    ).value;

  const mensaje =
    document.getElementById(
      "mensajeBloqueo"
    );


  mensaje.textContent = "";


  if (!fecha) {

    mensaje.className =
      "error";

    mensaje.textContent =
      "Elegí una fecha.";

    return;
  }


  try {

    const {
      data: existentes,
      error: errorBusqueda
    } =
      await supabaseClient
        .from("turnos")
        .select(
          "id,estado"
        )
        .eq("fecha", fecha)
        .eq("hora", hora);


    if (errorBusqueda) {
      throw errorBusqueda;
    }


    const ocupado =
      existentes.some(
        function(turno) {

          return turno.estado !==
            "cancelado";

        }
      );


    if (ocupado) {

      mensaje.className =
        "error";

      mensaje.textContent =
        "Ese horario ya está ocupado.";

      return;
    }


    const {
      error: errorInsertar
    } =
      await supabaseClient
        .from("turnos")
        .insert({

          fecha: fecha,

          hora: hora,

          nombre:
            "Horario bloqueado",

          telefono:
            "",

          estado:
            "bloqueado"

        });


    if (errorInsertar) {
      throw errorInsertar;
    }


    mensaje.className =
      "exito";

    mensaje.textContent =
      "✅ Horario bloqueado correctamente.";


    actualizarTodo();


  } catch (error) {

    console.error(error);

    mensaje.className =
      "error";

    mensaje.textContent =
      "No se pudo bloquear el horario.";

  }

}


/* =========================
   DESBLOQUEAR
========================= */

async function desbloquearHorario(id) {

  if (
    !confirm(
      "¿Querés desbloquear este horario?"
    )
  ) {
    return;
  }


  try {

    const {
      error
    } =
      await supabaseClient
        .from("turnos")
        .update({
          estado:
            "cancelado"
        })
        .eq("id", id);


    if (error) {
      throw error;
    }


    actualizarTodo();


  } catch (error) {

    console.error(error);

    alert(
      "No se pudo desbloquear."
    );

  }

}


/* =========================
   CANCELAR TURNO
========================= */

async function cancelarTurno(id) {

  if (
    !confirm(
      "¿Seguro que querés cancelar este turno?"
    )
  ) {
    return;
  }


  try {

    const {
      error
    } =
      await supabaseClient
        .from("turnos")
        .update({
          estado:
            "cancelado"
        })
        .eq("id", id);


    if (error) {
      throw error;
    }


    actualizarTodo();


  } catch (error) {

    console.error(error);

    alert(
      "No se pudo cancelar el turno."
    );

  }

}


/* =========================
   CAMBIAR MES
========================= */

function mesAnterior() {

  const hoy =
    new Date();

  const mesActual =
    new Date(
      hoy.getFullYear(),
      hoy.getMonth(),
      1
    );


  const nuevoMes =
    new Date(
      fechaActual.getFullYear(),
      fechaActual.getMonth() - 1,
      1
    );


  if (
    nuevoMes < mesActual
  ) {
    return;
  }


  fechaActual =
    nuevoMes;

  cargarTurnos();

}


function mesSiguiente() {

  fechaActual =
    new Date(
      fechaActual.getFullYear(),
      fechaActual.getMonth() + 1,
      1
    );

  cargarTurnos();

}


/* =========================
   INICIAR
========================= */

comprobarSesion();

</script>

</body>
</html>
