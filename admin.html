<body>

  <div class="container">

    <h1>MUDITOOO BARBER</h1>
    <p class="subtitulo">📅 Panel de administrador</p>

    <div class="card">

      <div class="mes">
        <button type="button" onclick="mesAnterior()">‹</button>

        <span id="nombreMes"></span>

        <button type="button" onclick="mesSiguiente()">›</button>
      </div>

      <div id="turnos">
        <p class="vacio">Cargando turnos...</p>
      </div>

    </div>

    <a href="index.html" class="volver">
      ← ir a reservar turno
    </a>

  </div>

  <script>

    const SUPABASE_URL =
      "https://tfwejlwycexmcgznxlao.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_RnheFzHcB78UTEaXBYOp9g_ZbktcycR";


    let fechaActual = new Date();


    const nombresMeses = [
      "enero",
      "febrero",
      "marzo",
      "abril",
      "mayo",
      "junio",
      "julio",
      "agosto",
      "septiembre",
      "octubre",
      "noviembre",
      "diciembre"
    ];


    function formatoFecha(fecha) {

      const año = fecha.getFullYear();

      const mes = String(
        fecha.getMonth() + 1
      ).padStart(2, "0");

      const dia = String(
        fecha.getDate()
      ).padStart(2, "0");

      return `${año}-${mes}-${dia}`;
    }


    async function cargarTurnos() {

      const contenedor =
        document.getElementById("turnos");

      const nombreMes =
        document.getElementById("nombreMes");


      nombreMes.textContent =
        nombresMeses[fechaActual.getMonth()] +
        " " +
        fechaActual.getFullYear();


      contenedor.innerHTML =
        '<p class="vacio">Cargando turnos...</p>';


      const año =
        fechaActual.getFullYear();

      const mes =
        fechaActual.getMonth();


      const primerDia =
        formatoFecha(
          new Date(año, mes, 1)
        );


      const ultimoDia =
        formatoFecha(
          new Date(año, mes + 1, 0)
        );


      try {

        const respuesta = await fetch(
          SUPABASE_URL +
          "/rest/v1/turnos" +
          "?fecha=gte." +
          primerDia +
          "&fecha=lte." +
          ultimoDia +
          "&select=fecha,hora,nombre,telefono,estado" +
          "&order=fecha.asc,hora.asc",
          {
            method: "GET",

            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization":
                "Bearer " + SUPABASE_KEY
            }
          }
        );


        if (!respuesta.ok) {
          throw new Error(
            "No se pudieron cargar los turnos"
          );
        }


        const datos =
          await respuesta.json();


        contenedor.innerHTML = "";


        if (datos.length === 0) {

          contenedor.innerHTML =
            '<p class="vacio">No hay turnos reservados este mes.</p>';

          return;
        }


        datos.forEach(function(turno) {

          const div =
            document.createElement("div");

          div.className = "turno";


          div.innerHTML = `
            <strong>📅 ${turno.fecha} — 🕐 ${turno.hora}</strong>
            <p>👤 ${turno.nombre}</p>
            <p>📱 ${turno.telefono}</p>
            <p>Estado: ${turno.estado}</p>
          `;


          contenedor.appendChild(div);

        });


      } catch (error) {

        console.error(error);

        contenedor.innerHTML =
          '<p class="error">Error al cargar los turnos.</p>';

      }

    }


    function mesAnterior() {

      const hoy = new Date();

      const mesActual =
        new Date(
          hoy.getFullYear(),
          hoy.getMonth(),
          1
        );


      const nuevoMes =
        new Date(
          fechaActual.getFullYear(),
          fechaActual.getMonth() - 1,
          1
        );


      if (nuevoMes < mesActual) {
        return;
      }


      fechaActual = nuevoMes;

      cargarTurnos();

    }


    function mesSiguiente() {

      fechaActual =
        new Date(
          fechaActual.getFullYear(),
          fechaActual.getMonth() + 1,
          1
        );


      cargarTurnos();

    }


    cargarTurnos();

  </script>

</body>
</html>
