<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservar turno - Muditooo Barber</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #111;
      color: white;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    header {
      text-align: center;
      padding: 25px 0;
    }

    header h1 {
      font-size: 34px;
      margin-bottom: 8px;
    }

    header p {
      color: #aaa;
    }

    .card {
      background: #1c1c1c;
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .mes {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .mes button {
      background: #333;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 15px;
      cursor: pointer;
      font-size: 18px;
    }

    .mes button:hover {
      background: #444;
    }

    #nombreMes {
      font-size: 20px;
      font-weight: bold;
      text-transform: capitalize;
    }

    .dias {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-bottom: 6px;
    }

    .nombre-dia {
      text-align: center;
      color: #aaa;
      font-size: 13px;
      padding: 8px 0;
    }

    .calendario {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .dia {
      min-height: 48px;
      background: #292929;
      border: none;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    .dia:hover {
      background: #444;
    }

    .dia.vacio {
      background: transparent;
      cursor: default;
    }

    .dia.domingo {
      color: #555;
      cursor: not-allowed;
    }

    .dia.seleccionado {
      background: white;
      color: black;
      font-weight: bold;
    }

    .dia.hoy {
      border: 1px solid white;
    }

    .horarios {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .hora {
      padding: 15px;
      background: #292929;
      border: none;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    .hora:hover {
      background: #444;
    }

    .hora.ocupado {
      background: #444;
      color: #777;
      cursor: not-allowed;
      text-decoration: line-through;
    }

    .hora.seleccionada {
      background: white;
      color: black;
    }

    .mensaje {
      text-align: center;
      color: #aaa;
      margin: 15px 0;
      line-height: 1.5;
    }

    .formulario {
      display: none;
      margin-top: 25px;
    }

    .formulario.mostrar {
      display: block;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
    }

    .confirmar {
      width: 100%;
      padding: 16px;
      background: white;
      color: black;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .confirmar:hover {
      background: #ddd;
    }

    .confirmar:disabled {
      background: #555;
      color: #999;
      cursor: not-allowed;
    }

    .exito {
      display: none;
      text-align: center;
      padding: 25px;
      background: #1c1c1c;
      border-radius: 15px;
      margin-top: 20px;
    }

    .exito.mostrar {
      display: block;
    }

    .exito h2 {
      margin-bottom: 15px;
    }

    .volver {
      display: block;
      margin-top: 20px;
      color: white;
      text-decoration: none;
      text-align: center;
    }

    @media (max-width: 500px) {
      .horarios {
        grid-template-columns: 1fr;
      }

      header h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <h1>✂️ MUDITOOO BARBER</h1>
    <p>Elegí tu día y horario</p>
  </header>

  <div class="card">

    <div class="mes">
      <button onclick="mesAnterior()">‹</button>
      <span id="nombreMes"></span>
      <button onclick="mesSiguiente()">›</button>
    </div>

    <div class="dias">
      <div class="nombre-dia">Lun</div>
      <div class="nombre-dia">Mar</div>
      <div class="nombre-dia">Mié</div>
      <div class="nombre-dia">Jue</div>
      <div class="nombre-dia">Vie</div>
      <div class="nombre-dia">Sáb</div>
      <div class="nombre-dia">Dom</div>
    </div>

    <div id="calendario" class="calendario"></div>

    <p id="mensajeDia" class="mensaje">
      Elegí un día para ver los horarios.
    </p>

    <div id="horarios" class="horarios"></div>

    <div id="formulario" class="formulario">

      <h2>Datos del turno</h2>

      <input
        type="text"
        id="nombre"
        placeholder="Nombre y apellido"
        required
      >

      <input
        type="tel"
        id="telefono"
        placeholder="Teléfono"
        required
      >

      <button
        id="botonConfirmar"
        class="confirmar"
        onclick="reservarTurno()">
        Confirmar turno
      </button>

    </div>

  </div>

  <div id="exito" class="exito">

    <h2>✅ Turno reservado</h2>

    <p id="detalleTurno"></p>

    <a href="reservas.html" class="volver">
      Volver al calendario
    </a>

  </div>

</div>

<script>

  /*
  ==================================================
  CONFIGURACIÓN DE SUPABASE
  ==================================================

  Pegá TU PUBLISHABLE KEY entre las comillas.

  NO pongas ninguna clave que empiece por:
  sb_secret_

  ==================================================
  */

  const SUPABASE_URL =
    "https://tfwejlwycexmcgznxlao.supabase.co";

  const SUPABASE_KEY =
    sb_publishable_RnheFzHcB78UTEaXBYOp9g_ZbktcycR


  /*
  ==================================================
  CONFIGURACIÓN DE TURNOS
  ==================================================
  */

  const horarios = [
    "14:40",
    "15:40",
    "16:40",
    "17:40",
    "18:40",
    "19:40",
    "20:40"
  ];

  let fechaActual = new Date();

  let fechaSeleccionada = null;

  let horaSeleccionada = null;

  /*
  ==================================================
  CALENDARIO
  ==================================================
  */

  function mostrarCalendario() {

    const calendario =
      document.getElementById("calendario");

    calendario.innerHTML = "";

    const año = fechaActual.getFullYear();

    const mes = fechaActual.getMonth();

    const primerDia =
      new Date(año, mes, 1);

    const ultimoDia =
      new Date(año, mes + 1, 0);

    const nombreMes =
      fechaActual.toLocaleDateString(
        "es-AR",
        {
          month: "long",
          year: "numeric"
        }
      );

    document.getElementById("nombreMes")
      .textContent = nombreMes;

    /*
      Convertimos domingo=0 a lunes=0
    */

    let inicio =
      primerDia.getDay();

    if (inicio === 0) {
      inicio = 6;
    } else {
      inicio = inicio - 1;
    }

    /*
      Espacios antes del primer día
    */

    for (let i = 0; i < inicio; i++) {

      const vacio =
        document.createElement("div");

      vacio.className = "dia vacio";

      calendario.appendChild(vacio);
    }

    /*
      Días del mes
    */

    for (
      let dia = 1;
      dia <= ultimoDia.getDate();
      dia++
    ) {

      const boton =
        document.createElement("button");

      boton.className = "dia";

      boton.textContent = dia;

      const fecha =
        new Date(año, mes, dia);

      /*
        Domingo
      */

      if (fecha.getDay() === 0) {

        boton.classList.add("domingo");

        boton.disabled = true;

      } else {

        /*
          Día actual
        */

        const hoy = new Date();

        if (
          fecha.getDate() === hoy.getDate() &&
          fecha.getMonth() === hoy.getMonth() &&
          fecha.getFullYear() === hoy.getFullYear()
        ) {

          boton.classList.add("hoy");

        }

        /*
          No permitir días anteriores
        */

        const hoySinHora =
          new Date(
            hoy.getFullYear(),
            hoy.getMonth(),
            hoy.getDate()
          );

        if (fecha < hoySinHora) {

          boton.disabled = true;

          boton.style.opacity = "0.3";

        } else {

          boton.onclick = function() {

            seleccionarDia(fecha);

          };

        }

      }

      calendario.appendChild(boton);
    }
  }


  /*
  ==================================================
  SELECCIONAR DÍA
  ==================================================
  */

  function seleccionarDia(fecha) {

    fechaSeleccionada = fecha;

    horaSeleccionada = null;

    document
      .querySelectorAll(".dia")
      .forEach(dia => {
        dia.classList.remove("seleccionado");
      });

    const botones =
      document.querySelectorAll(".dia");

    botones.forEach(boton => {

      if (
        boton.textContent ==
        fecha.getDate()
      ) {

        boton.classList.add("seleccionado");

      }

    });

    const textoFecha =
      fecha.toLocaleDateString(
        "es-AR",
        {
          weekday: "long",
          day: "numeric",
          month: "long"
        }
      );

    document.getElementById("mensajeDia")
      .textContent =
      "Horarios disponibles para " +
      textoFecha;

    cargarHorarios();
  }


  /*
  ==================================================
  CARGAR HORARIOS
  ==================================================
  */

  async function cargarHorarios() {

    const contenedor =
      document.getElementById("horarios");

    contenedor.innerHTML = "";

    document.getElementById("formulario")
      .classList.remove("mostrar");

    if (!fechaSeleccionada) {
      return;
    }

    const fechaTexto =
      formatearFecha(fechaSeleccionada);

    let turnosOcupados = [];

    try {

      const respuesta =
        await fetch(
          SUPABASE_URL +
          "/rest/v1/turnos?fecha=eq." +
          fechaTexto +
          "&select=hora,estado",
          {
            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization":
                "Bearer " + SUPABASE_KEY
            }
          }
        );

      if (respuesta.ok) {

        const datos =
          await respuesta.json();

        turnosOcupados =
          datos
            .filter(t => t.estado !== "cancelado")
            .map(t => t.hora);

      }

    } catch (error) {

      console.log(
        "No se pudieron consultar los turnos",
        error
      );

    }

    horarios.forEach(hora => {

      const boton =
        document.createElement("button");

      boton.className = "hora";

      boton.textContent = hora;

      if (
        turnosOcupados.includes(hora)
      ) {

        boton.classList.add("ocupado");

        boton.disabled = true;

        boton.textContent =
          hora + " - Ocupado";

      } else {

        boton.onclick = function() {

          seleccionarHora(
            hora,
            boton
          );

        };

      }

      contenedor.appendChild(boton);

    });
  }


  /*
  ==================================================
  SELECCIONAR HORA
  ==================================================
  */

  function seleccionarHora(
    hora,
    boton
  ) {

    horaSeleccionada = hora;

    document
      .querySelectorAll(".hora")
      .forEach(h => {
        h.classList.remove("seleccionada");
      });

    boton.classList.add("seleccionada");

    document.getElementById("formulario")
      .classList.add("mostrar");

    document.getElementById("formulario")
      .scrollIntoView({
        behavior: "smooth"
      });
  }


  /*
  ==================================================
  RESERVAR TURNO
  ==================================================
  */

  async function reservarTurno() {

    const nombre =
      document.getElementById("nombre")
        .value.trim();

    const telefono =
      document.getElementById("telefono")
        .value.trim();

    if (!fechaSeleccionada) {

      alert("Elegí un día.");

      return;
    }

    if (!horaSeleccionada) {

      alert("Elegí un horario.");

      return;
    }

    if (!nombre || !telefono) {

      alert("Completá tu nombre y teléfono.");

      return;
    }

    const boton =
      document.getElementById(
        "botonConfirmar"
      );

    boton.disabled = true;

    boton.textContent =
      "Reservando...";

    const fechaTexto =
      formatearFecha(fechaSeleccionada);

    try {

      /*
        Primero verificamos nuevamente
        que el horario siga libre.
      */

      const comprobacion =
        await fetch(
          SUPABASE_URL +
          "/rest/v1/turnos?fecha=eq." +
          fechaTexto +
          "&hora=eq." +
          encodeURIComponent(horaSeleccionada) +
          "&estado=neq.cancelado&select=id",
          {
            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization":
                "Bearer " + SUPABASE_KEY
            }
          }
        );

      const existentes =
        await comprobacion.json();

      if (existentes.length > 0) {

        alert(
          "Ese horario acaba de ser reservado. Elegí otro."
        );

        boton.disabled = false;

        boton.textContent =
          "Confirmar turno";

        cargarHorarios();

        return;
      }

      /*
        Guardamos el turno
      */

      const respuesta =
        await fetch(
          SUPABASE_URL +
          "/rest/v1/turnos",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json",

              "apikey":
                SUPABASE_KEY,

              "Authorization":
                "Bearer " + SUPABASE_KEY,

              "Prefer":
                "return=minimal"
            },

            body: JSON.stringify({

              fecha: fechaTexto,

              hora: horaSeleccionada,

              nombre: nombre,

              telefono: telefono,

              estado: "confirmado"

            })
          }
        );

      if (!respuesta.ok) {

        throw new Error(
          "No se pudo guardar el turno."
        );
      }

      const fechaBonita =
        fechaSeleccionada.toLocaleDateString(
          "es-AR",
          {
            weekday: "long",
            day: "numeric",
            month: "long"
          }
        );

      document.getElementById(
        "detalleTurno"
      ).textContent =
        nombre +
        ", tu turno quedó reservado para el " +
        fechaBonita +
        " a las " +
        horaSeleccionada +
        ".";

      document.getElementById("exito")
        .classList.add("mostrar");

      document.querySelector(".card")
        .style.display = "none";

    } catch (error) {

      console.error(error);

      alert(
        "No se pudo reservar el turno. Revisá la conexión con Supabase."
      );

      boton.disabled = false;

      boton.textContent =
        "Confirmar turno";
    }
  }


  /*
  ==================================================
  FORMATO DE FECHA
  ==================================================
  */

  function formatearFecha(fecha) {

    const año =
      fecha.getFullYear();

    const mes =
      String(
        fecha.getMonth() + 1
      ).padStart(2, "0");

    const dia =
      String(
        fecha.getDate()
      ).padStart(2, "0");

    return (
      año +
      "-" +
      mes +
      "-" +
      dia
    );
  }


  /*
  ==================================================
  CAMBIAR MES
  ==================================================
  */

  function mesAnterior() {

    const ahora = new Date();

    const mesActual =
      ahora.getMonth();

    const añoActual =
      ahora.getFullYear();

    if (
      fechaActual.getFullYear() === añoActual &&
      fechaActual.getMonth() <= mesActual
    ) {

      return;
    }

    fechaActual.setMonth(
      fechaActual.getMonth() - 1
    );

    mostrarCalendario();
  }


  function mesSiguiente() {

    fechaActual.setMonth(
      fechaActual.getMonth() + 1
    );

    mostrarCalendario();
  }


  /*
  ==================================================
  INICIAR
  ==================================================
  */

  mostrarCalendario();

</script>

</body>
</html>
