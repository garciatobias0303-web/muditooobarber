<body>

<div class="container">

  <div class="card">

  </a>

</div>


<script>

const SUPABASE_URL =
  "https://tfwejlwycexmcgznxlao.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_RnheFzHcB78UTEaXBYOp9g_ZbktcycR";


const horarios = [
  "14:40",
  "15:40",
  "16:40",
  "17:40",
  "18:40",
  "19:40",
  "20:40"
];


let fechaActual = new Date();


const nombresMeses = [
  "enero",
  "febrero",
  "marzo",
  "abril",
  "mayo",
  "junio",
  "julio",
  "agosto",
  "septiembre",
  "octubre",
  "noviembre",
  "diciembre"
];


function formatoFecha(fecha) {

  const año =
    fecha.getFullYear();

  const mes =
    String(
      fecha.getMonth() + 1
    ).padStart(2, "0");

  const dia =
    String(
      fecha.getDate()
    ).padStart(2, "0");

  return `${año}-${mes}-${dia}`;
}


/* =========================
   CARGAR TURNOS
========================= */

async function cargarTurnos() {

  const contenedor =
    document.getElementById("turnos");

  const nombreMes =
    document.getElementById("nombreMes");


  nombreMes.textContent =
    nombresMeses[
      fechaActual.getMonth()
    ] +
    " " +
    fechaActual.getFullYear();


  contenedor.innerHTML =
    '<p class="vacio">Cargando...</p>';


  const año =
    fechaActual.getFullYear();

  const mes =
    fechaActual.getMonth();


  const primerDia =
    formatoFecha(
      new Date(año, mes, 1)
    );


  const ultimoDia =
    formatoFecha(
      new Date(año, mes + 1, 0)
    );


  try {

    const url =
      SUPABASE_URL +
      "/rest/v1/turnos" +
      "?fecha=gte." +
      primerDia +
      "&fecha=lte." +
      ultimoDia +
      "&select=id,fecha,hora,nombre,telefono,estado" +
      "&order=fecha.asc,hora.asc";


    const respuesta =
      await fetch(
        url,
        {
          method: "GET",

          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization":
              "Bearer " + SUPABASE_KEY
          }
        }
      );


    const texto =
      await respuesta.text();


    if (!respuesta.ok) {

      console.error(
        "Error Supabase:",
        respuesta.status,
        texto
      );

      throw new Error(
        "Error Supabase"
      );
    }


    const datos =
      JSON.parse(texto);


    contenedor.innerHTML = "";


    if (datos.length === 0) {

      contenedor.innerHTML =
        '<p class="vacio">' +
        'No hay turnos este mes.' +
        '</p>';

      return;
    }


    datos.forEach(
      function(turno) {

        const div =
          document.createElement("div");

        div.className =
          "turno";


        let boton = "";


        if (
          turno.estado ===
          "bloqueado"
        ) {

          boton = `
            <button
              class="desbloquear"
              onclick="desbloquearHorario(${turno.id})"
            >
              🔓 Desbloquear horario
            </button>
          `;

        } else if (
          turno.estado !==
          "cancelado"
        ) {

          boton = `
            <button
              class="cancelar"
              onclick="cancelarTurno(${turno.id})"
            >
              ❌ Cancelar turno
            </button>
          `;

        }


        div.innerHTML = `

          <strong>
            📅 ${turno.fecha}
            — 🕐 ${turno.hora}
          </strong>

          ${
            turno.estado === "bloqueado"
            ? `
              <p>🚫 Horario bloqueado</p>
            `
            : `
              <p>👤 ${turno.nombre}</p>
              <p>📱 ${turno.telefono}</p>
            `
          }

          <p>
            Estado: ${turno.estado}
          </p>

          ${boton}

        `;


        contenedor.appendChild(div);

      }
    );


  } catch (error) {

    console.error(error);

    contenedor.innerHTML =
      '<p class="error">' +
      'No se pudieron cargar los turnos.' +
      '</p>';

  }

}


/* =========================
   BLOQUEAR HORARIO
========================= */

async function bloquearHorario() {

  const fecha =
    document.getElementById(
      "fechaBloqueo"
    ).value;

  const hora =
    document.getElementById(
      "horaBloqueo"
    ).value;

  const mensaje =
    document.getElementById(
      "mensajeBloqueo"
    );


  mensaje.textContent = "";


  if (!fecha) {

    mensaje.className =
      "mensaje error";

    mensaje.textContent =
      "Elegí una fecha.";

    return;
  }


  try {

    /* comprobar si ya existe */

    const comprobar =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/turnos" +
        "?fecha=eq." +
        fecha +
        "&hora=eq." +
        encodeURIComponent(hora) +
        "&select=id,estado",
        {
          method: "GET",

          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization":
              "Bearer " + SUPABASE_KEY
          }
        }
      );


    const existentes =
      await comprobar.json();


    const ocupado =
      existentes.some(
        function(turno) {

          return turno.estado !==
            "cancelado";

        }
      );


    if (ocupado) {

      mensaje.className =
        "mensaje error";

      mensaje.textContent =
        "Ese horario ya está ocupado.";

      return;
    }


    /* crear bloqueo */

    const respuesta =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/turnos",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY,

            "Prefer":
              "return=minimal"
          },

          body: JSON.stringify({

            fecha: fecha,

            hora: hora,

            nombre:
              "Horario bloqueado",

            telefono:
              "",

            estado:
              "bloqueado"

          })
        }
      );


    if (!respuesta.ok) {

      const texto =
        await respuesta.text();

      console.error(texto);

      throw new Error(
        "No se pudo bloquear"
      );
    }


    mensaje.className =
      "mensaje exito";

    mensaje.textContent =
      "✅ Horario bloqueado correctamente.";


    cargarTurnos();


  } catch (error) {

    console.error(error);

    mensaje.className =
      "mensaje error";

    mensaje.textContent =
      "No se pudo bloquear el horario.";

  }

}


/* =========================
   DESBLOQUEAR
========================= */

async function desbloquearHorario(id) {

  const confirmar =
    confirm(
      "¿Querés desbloquear este horario?"
    );


  if (!confirmar) {
    return;
  }


  try {

    const respuesta =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/turnos?id=eq." +
        id,
        {
          method: "PATCH",

          headers: {
            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY,

            "Prefer":
              "return=minimal"
          },

          body: JSON.stringify({
            estado:
              "cancelado"
          })
        }
      );


    if (!respuesta.ok) {

      throw new Error(
        "No se pudo desbloquear"
      );
    }


    cargarTurnos();


  } catch (error) {

    console.error(error);

    alert(
      "No se pudo desbloquear."
    );

  }

}


/* =========================
   CANCELAR TURNO
========================= */

async function cancelarTurno(id) {

  const confirmar =
    confirm(
      "¿Seguro que querés cancelar este turno?"
    );


  if (!confirmar) {
    return;
  }


  try {

    const respuesta =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/turnos?id=eq." +
        id,
        {
          method: "PATCH",

          headers: {
            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY,

            "Prefer":
              "return=minimal"
          },

          body: JSON.stringify({
            estado:
              "cancelado"
          })
        }
      );


    if (!respuesta.ok) {

      throw new Error(
        "No se pudo cancelar"
      );
    }


    cargarTurnos();


  } catch (error) {

    console.error(error);

    alert(
      "No se pudo cancelar el turno."
    );

  }

}


/* =========================
   CAMBIAR MES
========================= */

function mesAnterior() {

  const hoy =
    new Date();

  const mesActual =
    new Date(
      hoy.getFullYear(),
      hoy.getMonth(),
      1
    );


  const nuevoMes =
    new Date(
      fechaActual.getFullYear(),
      fechaActual.getMonth() - 1,
      1
    );


  if (nuevoMes < mesActual) {
    return;
  }


  fechaActual =
    nuevoMes;

  cargarTurnos();

}


function mesSiguiente() {

  fechaActual =
    new Date(
      fechaActual.getFullYear(),
      fechaActual.getMonth() + 1,
      1
    );


  cargarTurnos();

}


/* INICIAR */

cargarTurnos();

</script>

</body>
</html>
