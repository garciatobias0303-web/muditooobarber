<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://tfwejlwycexmcgznxlao.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_RnheFzHcB78UTEaXBYOp9g_ZbktcycR";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   VARIABLES
========================= */

let fechaActual =
  new Date();

let fechaSeleccionada =
  new Date();

let turnosMes = [];


const nombresMeses = [
  "enero",
  "febrero",
  "marzo",
  "abril",
  "mayo",
  "junio",
  "julio",
  "agosto",
  "septiembre",
  "octubre",
  "noviembre",
  "diciembre"
];


/* =========================
   FORMATO FECHA
========================= */

function formatoFecha(fecha) {

  const año =
    fecha.getFullYear();

  const mes =
    String(
      fecha.getMonth() + 1
    ).padStart(2, "0");

  const dia =
    String(
      fecha.getDate()
    ).padStart(2, "0");

  return `${año}-${mes}-${dia}`;
}


/* =========================
   FECHA PARA MOSTRAR
========================= */

function mostrarFecha(fecha) {

  return fecha.toLocaleDateString(
    "es-AR",
    {
      weekday: "long",
      day: "numeric",
      month: "long",
      year: "numeric"
    }
  );

}


/* =========================
   LOGIN
========================= */

async function iniciarSesion() {

  const email =
    document.getElementById(
      "email"
    ).value.trim();

  const password =
    document.getElementById(
      "password"
    ).value;

  const mensaje =
    document.getElementById(
      "mensajeLogin"
    );

  mensaje.textContent = "";


  if (!email || !password) {

    mensaje.textContent =
      "Completá Gmail y contraseña.";

    return;
  }


  const { error } =
    await supabaseClient.auth
      .signInWithPassword({
        email: email,
        password: password
      });


  if (error) {

    console.error(error);

    mensaje.textContent =
      "Gmail o contraseña incorrectos.";

    return;
  }


  mostrarAdmin();

}

========================= */

  document.getElementById(
    "admin"

  actualizarTodo();

/* =========================
   CERRAR SESIÓN
========================= */

async function cerrarSesion() {

  await supabaseClient.auth.signOut();

  document.getElementById(
    "admin"
  ).style.display = "none";

  document.getElementById(

    "password"

}


/* =========================
   COMPROBAR SESIÓN
========================= */

async function comprobarSesion() {

  const {
    data
  } =
    await supabaseClient.auth.getSession();


  if (data.session) {

    mostrarAdmin();

  }

}


/* =========================
   CARGAR TURNOS DEL MES
========================= */

async function cargarTurnosMes() {

  const año =
    fechaActual.getFullYear();

  const mes =
    fechaActual.getMonth();


  const primerDia =
    formatoFecha(
      new Date(
        año,
        mes,
        1
      )
    );


  const ultimoDia =
    formatoFecha(
      new Date(
        año,
        mes + 1,
        0
      )
    );


  const {
    data,
    error
  } =
    await supabaseClient
      .from("turnos")
      .select(
        "id,fecha,hora,nombre,telefono,estado"
      )
      .gte(
        "fecha",
        primerDia
      )
      .lte(
        "fecha",
        ultimoDia
      )
      .order(
        "fecha",
        {
          ascending: true
        }
      )
      .order(
        "hora",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(error);

    document.getElementById(
      "calendario"
    ).innerHTML =
      '<p class="error">No se pudieron cargar los turnos.</p>';

    return;

  }


  turnosMes =
    data || [];


  dibujarCalendario();

  mostrarTurnosDia();

}


/* =========================
   DIBUJAR CALENDARIO
========================= */

function dibujarCalendario() {

  const calendario =
    document.getElementById(
      "calendario"
    );

  const nombreMes =
    document.getElementById(
      "nombreMes"
    );


  const año =
    fechaActual.getFullYear();

  const mes =
    fechaActual.getMonth();


  nombreMes.textContent =
    nombresMeses[mes] +
    " " +
    año;


  calendario.innerHTML = "";


  /*
    JavaScript:
    0 = domingo
    1 = lunes
    etc.

    Convertimos para que:
    lunes = 0
    domingo = 6
  */

  const primerDiaSemana =
    new Date(
      año,
      mes,
      1
    ).getDay();


  const espacios =
    primerDiaSemana === 0
      ? 6
      : primerDiaSemana - 1;


  for (
    let i = 0;
    i < espacios;
    i++
  ) {

    const vacio =
      document.createElement(
        "div"
      );

    vacio.className =
      "dia vacio";

    calendario.appendChild(
      vacio
    );

  }


  const cantidadDias =
    new Date(
      año,
      mes + 1,
      0
    ).getDate();


  const hoy =
    formatoFecha(
      new Date()
    );


  for (
    let dia = 1;
    dia <= cantidadDias;
    dia++
  ) {

    const fecha =
      new Date(
        año,
        mes,
        dia
      );


    const fechaTexto =
      formatoFecha(fecha);


    const boton =
      document.createElement(
        "button"
      );


    boton.type = "button";

    boton.className =
      "dia";


    if (
      fechaTexto === hoy
    ) {

      boton.classList.add(
        "hoy"
      );

    }


    if (
      fechaTexto ===
      formatoFecha(
        fechaSeleccionada
      )
    ) {

      boton.classList.add(
        "seleccionado"
      );

    }


    if (
      fecha.getDay() === 0
    ) {

      boton.classList.add(
        "domingo"
      );

    }


    const turnosDelDia =
      turnosMes.filter(
        function(turno) {

          return (
            turno.fecha ===
            fechaTexto
          );

        }
      );


    const activos =
      turnosDelDia.filter(
        function(turno) {

          return (
            turno.estado !==
            "cancelado"
          );

        }
      );


    let indicador =
      "";


    if (
      activos.length > 0
    ) {

      indicador =
        `🕐 ${activos.length} turno${activos.length === 1 ? "" : "s"}`;

    } else {

      indicador =
        "Sin turnos";

    }


    boton.innerHTML = `

      <div class="numero-dia">
        ${dia}
      </div>

      <div class="indicador">
        ${indicador}
      </div>

    `;


    boton.onclick =
      function() {

        fechaSeleccionada =
          new Date(
            año,
            mes,
            dia
          );

        dibujarCalendario();

        mostrarTurnosDia();

      };


    calendario.appendChild(
      boton
    );

  }

}


/* =========================
   MOSTRAR TURNOS DEL DÍA
========================= */

function mostrarTurnosDia() {

  const contenedor =
    document.getElementById(
      "turnosDia"
    );

  const titulo =
    document.getElementById(
      "fechaSeleccionada"
    );


  const fecha =
    formatoFecha(
      fechaSeleccionada
    );


  titulo.textContent =
    mostrarFecha(
      fechaSeleccionada
    );


  const turnos =
    turnosMes.filter(
      function(turno) {

        return turno.fecha ===
          fecha;

      }
    );


  contenedor.innerHTML = "";


  if (
    turnos.length === 0
  ) {

    contenedor.innerHTML =
      '<p class="sin-turnos">No hay turnos para este día.</p>';

    return;
  }


  turnos.forEach(
    function(turno) {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "turno";


      if (
        turno.estado ===
        "cancelado"
      ) {

        div.classList.add(
          "cancelado"
        );

      }


      if (
        turno.estado ===
        "bloqueado"
      ) {

        div.classList.add(
          "bloqueado"
        );

        div.innerHTML = `

          <strong>
            🕐 ${turno.hora}
          </strong>

          <p>
            🚫 Horario bloqueado
          </p>

          <p>
            Estado: bloqueado
          </p>

          <button
            class="desbloquear"
            onclick="desbloquearHorario(${turno.id})"
          >
            🔓 Desbloquear horario
          </button>

        `;

      } else {

        let boton = "";


        if (
          turno.estado !==
          "cancelado"
        ) {

          boton = `

            <button
              class="cancelar"
              onclick="cancelarTurno(${turno.id})"
            >
              ❌ Cancelar turno
            </button>

          `;

        }


        div.innerHTML = `

          <strong>
            🕐 ${turno.hora}
          </strong>

          <p>
            👤 ${turno.nombre}
          </p>

          <p>
            📱 ${turno.telefono}
          </p>

          <p>
            Estado: ${turno.estado}
          </p>

          ${boton}

        `;

      }


      contenedor.appendChild(
        div
      );

    }
  );

}


/* =========================
   BLOQUEAR HORARIO
========================= */

async function bloquearHorario() {

  const fecha =
    document.getElementById(
      "fechaBloqueo"
    ).value;

  const hora =
    document.getElementById(
      "horaBloqueo"
    ).value;

  const mensaje =
    document.getElementById(
      "mensajeBloqueo"
    );


  mensaje.textContent = "";


  if (!fecha) {

    mensaje.className =
      "mensaje error";

    mensaje.textContent =
      "Elegí una fecha.";

    return;

  }


  try {

    const {
      data: existentes,
      error: errorBusqueda
    } =
      await supabaseClient
        .from("turnos")
        .select(
          "id,estado"
        )
        .eq(
          "fecha",
          fecha
        )
        .eq(
          "hora",
          hora
        );


    if (errorBusqueda) {
      throw errorBusqueda;
    }


    const ocupado =
      existentes.some(
        function(turno) {

          return turno.estado !==
            "cancelado";

        }
      );


    if (ocupado) {

      mensaje.className =
        "mensaje error";

      mensaje.textContent =
        "Ese horario ya está ocupado.";

      return;

    }


    const {
      error
    } =
      await supabaseClient
        .from("turnos")
        .insert({

          fecha: fecha,

          hora: hora,

          nombre:
            "Horario bloqueado",

          telefono:
            "",

          estado:
            "bloqueado"

        });


    if (error) {
      throw error;
    }


    mensaje.className =
      "mensaje exito";

    mensaje.textContent =
      "✅ Horario bloqueado correctamente.";


    fechaSeleccionada =
      new Date(
        fecha + "T00:00:00"
      );


    actualizarTodo();

  } catch (error) {

    console.error(error);

    mensaje.className =
      "mensaje error";

    mensaje.textContent =
      "No se pudo bloquear el horario.";

  }

}


/* =========================
   CANCELAR TURNO
========================= */

async function cancelarTurno(id) {

  if (
    !confirm(
      "¿Seguro que querés cancelar este turno?"
    )
  ) {

    return;

  }


  try {

    const {
      error
    } =
      await supabaseClient
        .from("turnos")
        .update({
          estado:
            "cancelado"
        })
        .eq(
          "id",
          id
        );


    if (error) {
      throw error;
    }


    actualizarTodo();

  } catch (error) {

    console.error(error);

    alert(
      "No se pudo cancelar el turno."
    );

  }

}


/* =========================
   DESBLOQUEAR
========================= */

async function desbloquearHorario(id) {

  if (
    !confirm(
      "¿Querés desbloquear este horario?"
    )
  ) {

    return;

  }


  try {

    const {
      error
    } =
      await supabaseClient
        .from("turnos")
        .update({
          estado:
            "cancelado"
        })
        .eq(
          "id",
          id
        );


    if (error) {
      throw error;
    }


    actualizarTodo();

  } catch (error) {

    console.error(error);

    alert(
      "No se pudo desbloquear."
    );

  }

}


/* =========================
   ACTUALIZAR TODO
========================= */

function actualizarTodo() {

  cargarTurnosMes();

}


/* =========================
   MES ANTERIOR
========================= */

function mesAnterior() {

  const hoy =
    new Date();


  const mesActual =
    new Date(
      hoy.getFullYear(),
      hoy.getMonth(),
      1
    );


  const nuevoMes =
    new Date(
      fechaActual.getFullYear(),
      fechaActual.getMonth() - 1,
      1
    );


  if (
    nuevoMes < mesActual
  ) {

    return;

  }


  fechaActual =
    nuevoMes;


  fechaSeleccionada =
    new Date(
      fechaActual.getFullYear(),
      fechaActual.getMonth(),
      1
    );


  cargarTurnosMes();

}
