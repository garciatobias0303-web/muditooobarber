<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservar turno - MUDITOOO BARBER</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #111;
      color: white;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    header {
      text-align: center;
      padding: 25px 0;
    }

    header h1 {
      font-size: 34px;
      margin-bottom: 8px;
    }

    header p {
      color: #aaa;
    }

    .card {
      background: #1c1c1c;
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .mes {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .mes button {
      background: #333;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 15px;
      cursor: pointer;
      font-size: 20px;
    }

    #nombreMes {
      font-size: 20px;
      font-weight: bold;
      text-transform: capitalize;
    }

    .dias,
    .calendario {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .dias {
      margin-bottom: 6px;
    }

    .nombre-dia {
      text-align: center;
      color: #aaa;
      font-size: 13px;
      padding: 8px 0;
    }

    .dia {
      min-height: 48px;
      background: #292929;
      border: none;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    .dia:hover:not(:disabled) {
      background: #444;
    }

    .dia:disabled {
      cursor: not-allowed;
    }

    .dia.vacio {
      background: transparent;
      cursor: default;
    }

    .dia.domingo {
      color: #555;
    }

    .dia.seleccionado {
      background: white;
      color: black;
      font-weight: bold;
    }

    .dia.hoy {
      border: 1px solid white;
    }

    .horarios {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    .hora {
      padding: 15px;
      background: #292929;
      border: none;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    .hora:hover:not(:disabled) {
      background: #444;
    }

    .hora.ocupado {
      background: #444;
      color: #777;
      cursor: not-allowed;
      text-decoration: line-through;
    }

    .hora.seleccionada {
      background: white;
      color: black;
      font-weight: bold;
    }

    .mensaje {
      text-align: center;
      color: #aaa;
      margin: 15px 0;
      line-height: 1.5;
    }

    .formulario {
      display: none;
      margin-top: 25px;
    }

    .formulario.mostrar {
      display: block;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
    }

    .confirmar {
      width: 100%;
      padding: 16px;
      background: white;
      color: black;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .confirmar:disabled {
      background: #555;
      color: #999;
      cursor: not-allowed;
    }

    .exito {
      display: none;
      text-align: center;
      padding: 25px;
      background: #1c1c1c;
      border-radius: 15px;
      margin-top: 20px;
    }

    .exito.mostrar {
      display: block;
    }

    .volver {
      display: block;
      margin-top: 20px;
      color: white;
      text-decoration: none;
      text-align: center;
    }

    .error {
      color: #ff7777;
      text-align: center;
      margin-top: 15px;
    }

    @media (max-width: 500px) {
      .horarios {
        grid-template-columns: 1fr;
      }

      header h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <h1>MUDITOOO BARBER</h1>
    <p>Elegí tu día y horario</p>
  </header>

  <div class="card">

    <h2>📅 Reservar turno</h2>

    <div class="mes">
      <button type="button" onclick="mesAnterior()">‹</button>

      <span id="nombreMes"></span>

      <button type="button" onclick="mesSiguiente()">›</button>
    </div>

    <div class="dias">
      <div class="nombre-dia">Lun</div>
      <div class="nombre-dia">Mar</div>
      <div class="nombre-dia">Mié</div>
      <div class="nombre-dia">Jue</div>
      <div class="nombre-dia">Vie</div>
      <div class="nombre-dia">Sáb</div>
      <div class="nombre-dia">Dom</div>
    </div>

    <div id="calendario" class="calendario"></div>

    <p id="mensaje" class="mensaje">
      Seleccioná un día para ver los horarios.
    </p>

    <div id="horarios" class="horarios"></div>

    <div id="formulario" class="formulario">

      <input
        type="text"
        id="nombre"
        placeholder="Tu nombre"
        autocomplete="name"
      >

      <input
        type="tel"
        id="telefono"
        placeholder="Tu teléfono"
        autocomplete="tel"
      >

      <button
        type="button"
        id="botonConfirmar"
        class="confirmar"
        onclick="reservarTurno()"
      >
        Confirmar turno
      </button>

      <p id="error" class="error"></p>

    </div>

  </div>

  <div id="exito" class="exito">

    <h2>✅ ¡Turno reservado!</h2>

    <p id="detalleTurno"></p>

    <a href="index.html" class="volver">
      Volver al inicio
    </a>

  </div>

</div>

<script>

  // ==============================
  // SUPABASE
  // ==============================

  const SUPABASE_URL =
    "https://tfwejlwycexmcgznxlao.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_RnheFzHcB78UTEaXBYOp9g_ZbktcycR"


  // ==============================
  // HORARIOS
  // ==============================

  const horarios = [
    "14:40",
    "15:40",
    "16:40",
    "17:40",
    "18:40",
    "19:40",
    "20:40"
  ];


  // ==============================
  // VARIABLES
  // ==============================

  let fechaActual = new Date();

  let fechaSeleccionada = null;

  let horaSeleccionada = null;


  const nombresMeses = [
    "enero",
    "febrero",
    "marzo",
    "abril",
    "mayo",
    "junio",
    "julio",
    "agosto",
    "septiembre",
    "octubre",
    "noviembre",
    "diciembre"
  ];


  // ==============================
  // FECHA DE HOY
  // ==============================

  function fechaHoy() {

    const ahora = new Date();

    return new Date(
      ahora.getFullYear(),
      ahora.getMonth(),
      ahora.getDate()
    );

  }


  // ==============================
  // FORMATO FECHA
  // ==============================

  function formatoFecha(fecha) {

    const año = fecha.getFullYear();

    const mes = String(
      fecha.getMonth() + 1
    ).padStart(2, "0");

    const dia = String(
      fecha.getDate()
    ).padStart(2, "0");

    return `${año}-${mes}-${dia}`;

  }


  // ==============================
  // MOSTRAR CALENDARIO
  // ==============================

  function mostrarCalendario() {

    const calendario =
      document.getElementById("calendario");

    const nombreMes =
      document.getElementById("nombreMes");

    calendario.innerHTML = "";

    nombreMes.textContent =
      nombresMeses[fechaActual.getMonth()]
      + " "
      + fechaActual.getFullYear();


    const año =
      fechaActual.getFullYear();

    const mes =
      fechaActual.getMonth();


    const primerDia =
      new Date(año, mes, 1);

    let diaSemana =
      primerDia.getDay();


    // Domingo = 6
    // Lunes = 0

    diaSemana =
      diaSemana === 0
        ? 6
        : diaSemana - 1;


    const cantidadDias =
      new Date(año, mes + 1, 0).getDate();


    // Espacios antes del primer día

    for (
      let i = 0;
      i < diaSemana;
      i++
    ) {

      const espacio =
        document.createElement("div");

      espacio.className =
        "dia vacio";

      calendario.appendChild(espacio);

    }


    const hoy = fechaHoy();


    // Crear días

    for (
      let dia = 1;
      dia <= cantidadDias;
      dia++
    ) {

      const fecha =
        new Date(año, mes, dia);


      const boton =
        document.createElement("button");

      boton.type = "button";

      boton.className = "dia";

      boton.textContent = dia;


      // Domingo

      if (fecha.getDay() === 0) {

        boton.classList.add("domingo");

        boton.disabled = true;

      }


      // Días anteriores

      if (fecha < hoy) {

        boton.disabled = true;

        boton.style.opacity = "0.35";

      }


      // Hoy

      if (
        fecha.getTime() ===
        hoy.getTime()
      ) {

        boton.classList.add("hoy");

      }


      // Día seleccionado

      if (
        fechaSeleccionada &&
        formatoFecha(fecha) ===
        formatoFecha(fechaSeleccionada)
      ) {

        boton.classList.add(
          "seleccionado"
        );

      }


      // Click

      if (
        fecha >= hoy &&
        fecha.getDay() !== 0
      ) {

        boton.onclick = function() {

          seleccionarFecha(fecha);

        };

      }


      calendario.appendChild(boton);

    }

  }


  // ==============================
  // SELECCIONAR FECHA
  // ==============================

  async function seleccionarFecha(fecha) {

    fechaSeleccionada = fecha;

    horaSeleccionada = null;


    mostrarCalendario();


    document
      .getElementById("formulario")
      .classList.remove("mostrar");


    document
      .getElementById("mensaje")
      .textContent =
      "Cargando horarios...";


    await mostrarHorarios();

  }


  // ==============================
  // MOSTRAR HORARIOS
  // ==============================

  async function mostrarHorarios() {

    const contenedor =
      document.getElementById("horarios");

    contenedor.innerHTML = "";


    if (!fechaSeleccionada) {

      return;

    }


    const fecha =
      formatoFecha(fechaSeleccionada);


    let ocupados = [];


    try {

      const respuesta =
        await fetch(
          SUPABASE_URL +
          "/rest/v1/turnos?fecha=eq." +
          fecha +
          "&select=hora,estado",
          {
            method: "GET",

            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization":
                "Bearer " + SUPABASE_KEY
            }
          }
        );


      if (!respuesta.ok) {

        throw new Error(
          "Error al consultar Supabase"
        );

      }


      const datos =
        await respuesta.json();


      ocupados =
        datos
          .filter(function(turno) {

            return turno.estado !== "cancelado";

          })
          .map(function(turno) {

            return turno.hora;

          });


    } catch (error) {

      console.error(error);

      document
        .getElementById("mensaje")
        .textContent =
        "No se pudieron cargar los horarios.";

      return;

    }


    document
      .getElementById("mensaje")
      .textContent =
      "Elegí un horario disponible:";


    horarios.forEach(function(hora) {

      const boton =
        document.createElement("button");

      boton.type = "button";

      boton.className = "hora";

      boton.textContent = hora;


      if (
        ocupados.includes(hora)
      ) {

        boton.classList.add("ocupado");

        boton.disabled = true;

        boton.textContent =
          hora + " - Ocupado";

      } else {

        boton.onclick = function() {

          seleccionarHora(
            hora,
            boton
          );

        };

      }


      contenedor.appendChild(boton);

    });

  }


  // ==============================
  // SELECCIONAR HORA
  // ==============================

  function seleccionarHora(
    hora,
    botonSeleccionado
  ) {

    horaSeleccionada = hora;


    document
      .querySelectorAll(".hora")
      .forEach(function(boton) {

        boton.classList.remove(
          "seleccionada"
        );

      });


    botonSeleccionado.classList.add(
      "seleccionada"
    );


    document
      .getElementById("formulario")
      .classList.add("mostrar");


    document
      .getElementById("error")
      .textContent = "";

  }


  // ==============================
  // RESERVAR TURNO
  // ==============================

  async function reservarTurno() {

    const nombre =
      document
        .getElementById("nombre")
        .value
        .trim();


    const telefono =
      document
        .getElementById("telefono")
        .value
        .trim();


    const error =
      document.getElementById("error");


    error.textContent = "";


    if (
      !fechaSeleccionada ||
      !horaSeleccionada
    ) {

      error.textContent =
        "Elegí una fecha y un horario.";

      return;

    }


    if (!nombre) {

      error.textContent =
        "Ingresá tu nombre.";

      return;

    }


    if (!telefono) {

      error.textContent =
        "Ingresá tu teléfono.";

      return;

    }


    const boton =
      document.getElementById(
        "botonConfirmar"
      );


    boton.disabled = true;

    boton.textContent =
      "Guardando...";


    const fecha =
      formatoFecha(
        fechaSeleccionada
      );


    try {

      // Verificar nuevamente

      const comprobar =
        await fetch(
          SUPABASE_URL +
          "/rest/v1/turnos?fecha=eq." +
          fecha +
          "&hora=eq." +
          encodeURIComponent(
            horaSeleccionada
          ) +
          "&select=id,estado",
          {
            method: "GET",

            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization":
                "Bearer " + SUPABASE_KEY
            }
          }
        );


      if (!comprobar.ok) {

        throw new Error(
          "No se pudo comprobar el horario"
        );

      }


      const existentes =
        await comprobar.json();


      const ocupado =
        existentes.some(
          function(turno) {

            return turno.estado !==
              "cancelado";

          }
        );


      if (ocupado) {

        error.textContent =
          "Ese horario ya fue ocupado. Elegí otro.";

        await mostrarHorarios();

        boton.disabled = false;

        boton.textContent =
          "Confirmar turno";

        return;

      }


      // Guardar

      const respuesta =
        await fetch(
          SUPABASE_URL +
          "/rest/v1/turnos",
          {
            method: "POST",

            headers: {

              "Content-Type":
                "application/json",

              "apikey":
                SUPABASE_KEY,

              "Authorization":
                "Bearer " + SUPABASE_KEY,

              "Prefer":
                "return=minimal"

            },

            body: JSON.stringify({

              fecha: fecha,

              hora:
                horaSeleccionada,

              nombre:
                nombre,

              telefono:
                telefono,

              estado:
                "confirmado"

            })

          }
        );


      if (!respuesta.ok) {

        const texto =
          await respuesta.text();

        console.error(texto);

        throw new Error(
          "No se pudo guardar"
        );

      }


      // Mostrar éxito

      document
        .getElementById("detalleTurno")
        .textContent =
        "Tu turno quedó reservado para el " +
        fecha +
        " a las " +
        horaSeleccionada +
        ".";


      document
        .getElementById("exito")
        .classList.add("mostrar");


      document
        .querySelector(".card")
        .style.display = "none";


    } catch (errorReserva) {

      console.error(errorReserva);

      error.textContent =
        "Hubo un error al reservar. Intentá nuevamente.";

      boton.disabled = false;

      boton.textContent =
        "Confirmar turno";

    }

  }


  // ==============================
  // MES ANTERIOR
  // ==============================

  function mesAnterior() {

    const hoy =
      fechaHoy();


    const mesActual =
      new Date(
        hoy.getFullYear(),
        hoy.getMonth(),
        1
      );


    const nuevoMes =
      new Date(
        fechaActual.getFullYear(),
        fechaActual.getMonth() - 1,
        1
      );


    if (nuevoMes < mesActual) {

      return;

    }


    fechaActual =
      nuevoMes;


    mostrarCalendario();

  }


  // ==============================
  // MES SIGUIENTE
  // ==============================

  function mesSiguiente() {

    fechaActual =
      new Date(
        fechaActual.getFullYear(),
        fechaActual.getMonth() + 1,
        1
      );


    mostrarCalendario();

  }


  // ==============================
  // INICIAR CALENDARIO
  // ==============================

  mostrarCalendario();

</script>

</body>
</html>
