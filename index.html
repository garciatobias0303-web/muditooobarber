
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muditooo Barber</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #111;
      color: white;
    }

    header {
      text-align: center;
      padding: 60px 20px;
      background: #000;
    }

    header h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    header p {
      color: #ccc;
      font-size: 18px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 40px 20px;
    }

    .card {
      background: #1c1c1c;
      padding: 30px;
      border-radius: 15px;
      margin-bottom: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.4);
    }

    h2 {
      margin-bottom: 20px;
      text-align: center;
    }

    .info {
      text-align: center;
      color: #ccc;
      line-height: 1.8;
      margin-bottom: 25px;
    }

    .horario {
      text-align: center;
      font-size: 18px;
      color: #fff;
      margin-bottom: 25px;
    }

    .boton-reserva {
      display: block;
      width: 100%;
      padding: 17px;
      background: white;
      color: black;
      border-radius: 8px;
      text-decoration: none;
      text-align: center;
      font-size: 19px;
      font-weight: bold;
    }

    .boton-reserva:hover {
      background: #ddd;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #888;
      background: #000;
    }
  </style>
</head>

<body>

  <header>
    <h1>MUDITOOO BARBER</h1>
    <p>Tu corte, tu estilo.</p>
  </header>

  <div class="container">

    <div class="card">
      <h2>📅 Reservá tu turno</h2>

      <p class="info">
        Elegí el día y horario disponible directamente desde nuestra agenda.
      </p>

      <p class="horario">
        🕐 Atención de <strong>14:40 a 21:40</strong>
      </p>

      <a
        href="https://calendar.app.google/ziEmXCpbDADaraCo8"
        target="_blank"
        class="boton-reserva">
        📅 Reservar turno
      </a>
    </div>

    <div class="card">
      <h2>✂️ Muditooo Barber</h2>

      <p class="info">
        Reservá tu turno de manera rápida y sencilla.
      </p>
    </div>

  </div>

  <footer>
    © 2026 Muditooo Barber
  </footer>

</body>
</html>
