<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Muditooo Barber</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #111;
      color: white;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin: 30px 0;
    }

    .card {
      background: #1c1c1c;
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    h2 {
      margin-bottom: 20px;
    }

    .boton {
      display: block;
      width: 100%;
      padding: 15px;
      background: white;
      color: black;
      text-decoration: none;
      text-align: center;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 15px;
    }

    .boton:hover {
      background: #ddd;
    }

    .info {
      color: #ccc;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>✂️ MUDITOOO BARBER</h1>

    <div class="card">
      <h2>📅 Mis turnos</h2>

      <p class="info">
        Desde acá podés consultar y administrar tus turnos.
      </p>

      <a
        href="https://calendar.google.com/calendar/"
        target="_blank"
        class="boton">
        Abrir Google Calendar
      </a>
    </div>

    <div class="card">
      <h2>🚫 Bloquear horarios</h2>

      <p class="info">
        Si no podés atender en determinado horario, podés bloquearlo directamente desde Google Calendar.
      </p>

      <a
        href="https://calendar.google.com/calendar/"
        target="_blank"
        class="boton">
        Bloquear un horario
      </a>
    </div>

  </div>

</body>
</html>
