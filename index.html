<!DOCTYPE html>

<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muditooo Barber</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0b0b;
      color: white;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 80px 20px 70px;
      background: linear-gradient(180deg, #000 0%, #111 100%);
      border-bottom: 1px solid #222;
    }

    header h1 {
      font-size: 46px;
      letter-spacing: 3px;
      margin-bottom: 12px;
    }

    header p {
      color: #aaa;
      font-size: 18px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 45px 20px;
    }

    .card {
      background: #171717;
      padding: 32px;
      border-radius: 18px;
      margin-bottom: 25px;
      border: 1px solid #292929;
      box-shadow: 0 8px 30px rgba(0,0,0,0.45);
    }

    .card h2 {
      margin-bottom: 20px;
      text-align: center;
      font-size: 25px;
    }

    .info {
      text-align: center;
      color: #bdbdbd;
      line-height: 1.7;
      margin-bottom: 25px;
      font-size: 16px;
    }

    .horario {
      text-align: center;
      font-size: 18px;
      color: #fff;
      margin-bottom: 25px;
      padding: 14px;
      background: #101010;
      border-radius: 10px;
    }

    .boton-reserva,
    .boton-whatsapp {
      display: block;
      width: 100%;
      padding: 18px;
      border-radius: 10px;
      text-decoration: none;
      text-align: center;
      font-size: 19px;
      font-weight: bold;
      transition: 0.2s;
    }

    .boton-reserva {
      background: white;
      color: black;
      margin-bottom: 15px;
    }

    .boton-reserva:hover {
      transform: scale(1.02);
      background: #e8e8e8;
    }

    .boton-whatsapp {
      background: #25D366;
      color: white;
    }

    .boton-whatsapp:hover {
      transform: scale(1.02);
      background: #20bd5a;
    }

    footer {
      text-align: center;
      padding: 30px 20px;
      color: #777;
      background: #000;
      border-top: 1px solid #222;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      header {
        padding: 65px 20px 55px;
      }

      header h1 {
        font-size: 34px;
        letter-spacing: 2px;
      }

      header p {
        font-size: 16px;
      }

      .container {
        padding: 30px 15px;
      }

      .card {
        padding: 25px 20px;
      }

      .card h2 {
        font-size: 22px;
      }
    }
  </style>

</head>

<body>

  <header>

  </header>
