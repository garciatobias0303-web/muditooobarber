<body>

<div class="container">

  <h1>MUDITOOO BARBER</h1>

  <p class="subtitulo">
    📅 Panel de administrador
  </p>


  <!-- ACTUALIZAR -->

  <button
    class="actualizar"
    type="button"
    onclick="actualizarTodo()"
  >
    🔄 Actualizar
  </button>


  <!-- TURNOS DE HOY -->

  <div class="card hoy">

    <h2>📅 Turnos de hoy</h2>

    <p
      id="fechaHoy"
      class="fecha-hoy"
    ></p>

    <div id="turnosHoy">

      <p class="sin-turnos">
        Cargando...
      </p>

    </div>

  </div>


  <!-- BLOQUEAR HORARIO -->

  <div class="card">

    <h2>🚫 Bloquear horario</h2>

    <label for="fechaBloqueo">
      Fecha
    </label>

    <input
      type="date"
      id="fechaBloqueo"
    >

    <label for="horaBloqueo">
      Horario
    </label>

    <select id="horaBloqueo">

      <option value="14:40">14:40</option>
      <option value="15:40">15:40</option>
      <option value="16:40">16:40</option>
      <option value="17:40">17:40</option>
      <option value="18:40">18:40</option>
      <option value="19:40">19:40</option>
      <option value="20:40">20:40</option>

    </select>

    <button
      class="guardar"
      type="button"
      onclick="bloquearHorario()"
    >
      🚫 Bloquear horario
    </button>

    <p
      id="mensajeBloqueo"
      class="mensaje"
    ></p>

  </div>


  <!-- TURNOS DEL MES -->

  <div class="card">

    <div class="mes">

      <button
        type="button"
        onclick="mesAnterior()"
      >
        ‹
      </button>

      <span id="nombreMes"></span>

      <button
        type="button"
        onclick="mesSiguiente()"
      >
        ›
      </button>

    </div>

    <div id="turnos">

      <p class="vacio">
        Cargando...
      </p>

    </div>

  </div>

    href="reservas.html"
    class="volver"
  >
    ← Ir a reservar turno
  </a>

</div>


<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://tfwejlwycexmcgznxlao.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_RnheFzHcB78UTEaXBYOp9g_ZbktcycR";


/* =========================
   HORARIOS
========================= */

const horarios = [
  "14:40",
  "15:40",
  "16:40",
  "17:40",
  "18:40",
  "19:40",
  "20:40"
];


/* =========================
   VARIABLES
========================= */

let fechaActual = new Date();


const nombresMeses = [
  "enero",
  "febrero",
  "marzo",
  "abril",
  "mayo",
  "junio",
  "julio",
  "agosto",
  "septiembre",
  "octubre",
  "noviembre",
  "diciembre"
];


/* =========================
   FORMATO FECHA
========================= */

function formatoFecha(fecha) {

  const año =
    fecha.getFullYear();

  const mes =
    String(
      fecha.getMonth() + 1
    ).padStart(2, "0");

  const dia =
    String(
      fecha.getDate()
    ).padStart(2, "0");

  return `${año}-${mes}-${dia}`;
}


/* =========================
   FECHA DE HOY
========================= */

function mostrarFechaHoy() {

  const hoy =
    new Date();

  const texto =
    hoy.toLocaleDateString(
      "es-AR",
      {
        weekday: "long",
        day: "numeric",
        month: "long"
      }
    );

  document.getElementById(
    "fechaHoy"
  ).textContent = texto;
}


/* =========================
   CARGAR TURNOS DE HOY
========================= */

async function cargarTurnosHoy() {

  const contenedor =
    document.getElementById(
      "turnosHoy"
    );

  const hoy =
    formatoFecha(
      new Date()
    );

  contenedor.innerHTML =
    '<p class="sin-turnos">Cargando...</p>';


  try {

    const url =
      SUPABASE_URL +
      "/rest/v1/turnos" +
      "?fecha=eq." +
      hoy +
      "&select=id,fecha,hora,nombre,telefono,estado" +
      "&order=hora.asc";


    const respuesta =
      await fetch(
        url,
        {
          method: "GET",

          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization":
              "Bearer " + SUPABASE_KEY
          }
        }
      );


    if (!respuesta.ok) {

      throw new Error(
        "Error Supabase"
      );
    }


    const datos =
      await respuesta.json();


    const activos =
      datos.filter(
        function(turno) {

          return turno.estado !==
            "cancelado";

        }
      );


    contenedor.innerHTML = "";


    if (
      activos.length === 0
    ) {

      contenedor.innerHTML =
        '<p class="sin-turnos">' +
        'No hay turnos para hoy.' +
        '</p>';

      return;
    }


    activos.forEach(
      function(turno) {

        const div =
          document.createElement(
            "div"
          );

        div.className =
          "turno-hoy";


        if (
          turno.estado ===
          "bloqueado"
        ) {

          div.innerHTML = `

            <strong>
              🕐 ${turno.hora}
            </strong>

            <p>
              🚫 Horario bloqueado
            </p>

          `;

        } else {

          div.innerHTML = `

            <strong>
              🕐 ${turno.hora}
            </strong>

            <p>
              👤 ${turno.nombre}
            </p>

            <p>
              📱 ${turno.telefono}
            </p>

            <p>
              Estado: ${turno.estado}
            </p>

          `;

        }


        contenedor.appendChild(
          div
        );

      }
    );


  } catch (error) {

    console.error(error);

    contenedor.innerHTML =
      '<p class="error">' +
      'No se pudieron cargar los turnos de hoy.' +
      '</p>';

  }

}


/* =========================
   CARGAR TURNOS DEL MES
========================= */

async function cargarTurnos() {

  const contenedor =
    document.getElementById(
      "turnos"
    );

  const nombreMes =
    document.getElementById(
      "nombreMes"
    );


  nombreMes.textContent =
    nombresMeses[
      fechaActual.getMonth()
    ] +
    " " +
    fechaActual.getFullYear();


  contenedor.innerHTML =
    '<p class="vacio">Cargando...</p>';


  const año =
    fechaActual.getFullYear();

  const mes =
    fechaActual.getMonth();


  const primerDia =
    formatoFecha(
      new Date(
        año,
        mes,
        1
      )
    );


  const ultimoDia =
    formatoFecha(
      new Date(
        año,
        mes + 1,
        0
      )
    );


  try {

    const url =
      SUPABASE_URL +
      "/rest/v1/turnos" +
      "?fecha=gte." +
      primerDia +
      "&fecha=lte." +
      ultimoDia +
      "&select=id,fecha,hora,nombre,telefono,estado" +
      "&order=fecha.asc,hora.asc";


    const respuesta =
      await fetch(
        url,
        {
          method: "GET",

          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization":
              "Bearer " + SUPABASE_KEY
          }
        }
      );


    if (!respuesta.ok) {

      throw new Error(
        "Error Supabase"
      );
    }


    const datos =
      await respuesta.json();


    contenedor.innerHTML = "";


    if (
      datos.length === 0
    ) {

      contenedor.innerHTML =
        '<p class="vacio">' +
        'No hay turnos este mes.' +
        '</p>';

      return;
    }


    datos.forEach(
      function(turno) {

        const div =
          document.createElement(
            "div"
          );

        div.className =
          "turno";


        let boton = "";


        if (
          turno.estado ===
          "bloqueado"
        ) {

          boton = `

            <button
              class="desbloquear"
              onclick="desbloquearHorario(${turno.id})"
            >
              🔓 Desbloquear horario
            </button>

          `;

        } else if (
          turno.estado !==
          "cancelado"
        ) {

          boton = `

            <button
              class="cancelar"
              onclick="cancelarTurno(${turno.id})"
            >
              ❌ Cancelar turno
            </button>

          `;

        }


        div.innerHTML = `

          <strong>
            📅 ${turno.fecha}
            — 🕐 ${turno.hora}
          </strong>

          ${
            turno.estado ===
            "bloqueado"

            ? `

              <p>
                🚫 Horario bloqueado
              </p>

            `

            : `

              <p>
                👤 ${turno.nombre}
              </p>

              <p>
                📱 ${turno.telefono}
              </p>

            `
          }

          <p>
            Estado: ${turno.estado}
          </p>

          ${boton}

        `;


        contenedor.appendChild(
          div
        );

      }
    );


  } catch (error) {

    console.error(error);

    contenedor.innerHTML =
      '<p class="error">' +
      'No se pudieron cargar los turnos.' +
      '</p>';

  }

}


/* =========================
   ACTUALIZAR TODO
========================= */

function actualizarTodo() {

  cargarTurnosHoy();

  cargarTurnos();

}


/* =========================
   BLOQUEAR HORARIO
========================= */

async function bloquearHorario() {

  const fecha =
    document.getElementById(
      "fechaBloqueo"
    ).value;

  const hora =
    document.getElementById(
      "horaBloqueo"
    ).value;

  const mensaje =
    document.getElementById(
      "mensajeBloqueo"
    );


  mensaje.textContent = "";


  if (!fecha) {

    mensaje.className =
      "mensaje error";

    mensaje.textContent =
      "Elegí una fecha.";

    return;
  }


  try {

    const comprobar =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/turnos" +
        "?fecha=eq." +
        fecha +
        "&hora=eq." +
        encodeURIComponent(hora) +
        "&select=id,estado",

        {
          method: "GET",

          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization":
              "Bearer " + SUPABASE_KEY
          }
        }

      );


    const existentes =
      await comprobar.json();


    const ocupado =
      existentes.some(
        function(turno) {

          return turno.estado !==
            "cancelado";

        }
      );


    if (ocupado) {

      mensaje.className =
        "mensaje error";

      mensaje.textContent =
        "Ese horario ya está ocupado.";

      return;
    }


    const respuesta =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/turnos",

        {
          method: "POST",

          headers: {

            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY,

            "Prefer":
              "return=minimal"

          },

          body: JSON.stringify({

            fecha: fecha,

            hora: hora,

            nombre:
              "Horario bloqueado",

            telefono:
              "",

            estado:
              "bloqueado"

          })

        }

      );


    if (!respuesta.ok) {

      throw new Error(
        "No se pudo bloquear"
      );

    }


    mensaje.className =
      "mensaje exito";

    mensaje.textContent =
      "✅ Horario bloqueado correctamente.";


    actualizarTodo();

  } catch (error) {

    console.error(error);

    mensaje.className =
      "mensaje error";

    mensaje.textContent =
      "No se pudo bloquear el horario.";

  }

}


/* =========================
   DESBLOQUEAR
========================= */

async function desbloquearHorario(id) {

  const confirmar =
    confirm(
      "¿Querés desbloquear este horario?"
    );


  if (!confirmar) {
    return;
  }


  try {

    const respuesta =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/turnos?id=eq." +
        id,

        {

          method: "PATCH",

          headers: {

            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY,

            "Prefer":
              "return=minimal"

          },

          body: JSON.stringify({

            estado:
              "cancelado"

          })

        }

      );


    if (!respuesta.ok) {

      throw new Error(
        "No se pudo desbloquear"
      );

    }


    actualizarTodo();


  } catch (error) {

    console.error(error);

    alert(
      "No se pudo desbloquear."
    );

  }

}


/* =========================
   CANCELAR TURNO
========================= */

async function cancelarTurno(id) {

  const confirmar =
    confirm(
      "¿Seguro que querés cancelar este turno?"
    );


  if (!confirmar) {
    return;
  }


  try {

    const respuesta =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/turnos?id=eq." +
        id,

        {

          method: "PATCH",

          headers: {

            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY,

            "Prefer":
              "return=minimal"

          },

          body: JSON.stringify({

            estado:
              "cancelado"

          })

        }

      );


    if (!respuesta.ok) {

      throw new Error(
        "No se pudo cancelar"
      );

    }


    actualizarTodo();


  } catch (error) {

    console.error(error);

    alert(
      "No se pudo cancelar el turno."
    );

  }

}


/* =========================
   MES ANTERIOR
========================= */

function mesAnterior() {

  const hoy =
    new Date();


  const mesActual =
    new Date(
      hoy.getFullYear(),
      hoy.getMonth(),
      1
    );


  const nuevoMes =
    new Date(
      fechaActual.getFullYear(),
      fechaActual.getMonth() - 1,
      1
    );


  if (
    nuevoMes < mesActual
  ) {

    return;

  }


  fechaActual =
    nuevoMes;


  cargarTurnos();

}


/* =========================
   MES SIGUIENTE
========================= */

function mesSiguiente() {

  fechaActual =
    new Date(

      fechaActual.getFullYear(),

      fechaActual.getMonth() + 1,

      1

    );


  cargarTurnos();

}


/* =========================
   INICIAR
========================= */

mostrarFechaHoy();

cargarTurnosHoy();

cargarTurnos();

</script>

</body>
</html>
